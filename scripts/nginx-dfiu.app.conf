# DFIU nginx — RouteSmith-style OG injection.
# Vanity / UUID / /race/:uuid URLs → local og-server (injects meta into SPA shell).
# Everything else → static SPA.

map $uri $dfiu_og_path {
    default 0;
    "~*^/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/?$" 1;
    "~*^/race/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/?$" 1;
    "~*^/[a-z0-9][a-z0-9-]{1,46}[a-z0-9]/?$" 1;
}

map $uri $dfiu_reserved {
    default 0;
    "~*^/(login|signup|dashboard|settings|events|auth|assets|api|og-image|new)(/|$)" 1;
    "~*^/(logo\.png|og-default\.png)$" 1;
}

map "$dfiu_og_path:$dfiu_reserved" $dfiu_use_og {
    default 0;
    "1:0" 1;
}

server {
    server_name dfiu.app;
    root /var/www/dfiu;
    index index.html;

    location / {
        error_page 418 = @og_inject;
        if ($dfiu_use_og = 1) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @og_inject {
        proxy_pass http://127.0.0.1:3457;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dfiu.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dfiu.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = dfiu.app) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name dfiu.app;
    return 404; # managed by Certbot
}
