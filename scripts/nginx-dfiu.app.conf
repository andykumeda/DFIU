# Event vanity/UUID paths always get OG HTML (iMessage uses Safari-like UAs).
# Humans are JS-redirected to /race/:id by share-preview. Reserved app routes stay SPA.
map $uri $dfiu_event_path {
    default 0;
    "~*^/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/?$" 1;
    "~*^/[a-z0-9][a-z0-9-]{1,46}[a-z0-9]/?$" 1;
}

map $uri $dfiu_reserved {
    default 0;
    "~*^/(login|signup|dashboard|settings|events|auth|assets|api|og-image|new)(/|$)" 1;
    "~*^/(logo\.png|og-default\.png)$" 1;
}

map "$dfiu_event_path:$dfiu_reserved" $dfiu_serve_og {
    default 0;
    "1:0" 1;
}

server {
    server_name dfiu.app;
    root /var/www/dfiu;
    index index.html;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $dfiu_fn_host nyjgyyuoscgekavheeqi.supabase.co;

    location = /og-image {
        set $dfiu_fn_uri /functions/v1/share-preview$is_args$args;
        proxy_pass https://$dfiu_fn_host$dfiu_fn_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $dfiu_fn_host;
        proxy_set_header apikey ANON_KEY_PLACEHOLDER;
        proxy_set_header Authorization "Bearer ANON_KEY_PLACEHOLDER";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        error_page 418 = @og_preview;
        if ($dfiu_serve_og = 1) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @og_preview {
        set $dfiu_fn_uri /functions/v1/share-preview?path=$uri&format=html&$args;
        proxy_pass https://$dfiu_fn_host$dfiu_fn_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $dfiu_fn_host;
        proxy_set_header apikey ANON_KEY_PLACEHOLDER;
        proxy_set_header Authorization "Bearer ANON_KEY_PLACEHOLDER";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dfiu.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dfiu.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = dfiu.app) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name dfiu.app;
    return 404; # managed by Certbot
}
